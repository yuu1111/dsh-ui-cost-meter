# dsh-ui-cost-meter layer.
#
# Adds one plugin row. The host half registers the `costMeter` session
# projection (whole-log spend folded from durable provider usage) and the
# browser half adds one pill to the composer's stats dock.
#
# The plugin ships per-route unit prices for OpenCode Go, OpenCode Zen, and
# Command Code, so this row needs no `rates` at all. Configuration:
#   symbol:   display symbol prefixed to every amount. Default '$'.
#   defaults: use the shipped table. Set false to price only what `rates` and
#             `fallback` name.
#   rates:    per-1M-token unit prices that override the shipped table, keyed
#             by "<provider>/<model>" or by "<model>". The route key wins over
#             the bare model, which wins over `fallback`.
#   fallback: unit prices for every route no key matches. Omit it to leave
#             unmatched routes unpriced, which keeps a wrong rate from looking
#             right.
#
# Add a `rates` key for a route the shipped table gets wrong for you: a
# peak-hour price, a plan that meters its usage rather than billing per token,
# or a provider the table does not know. DeepSeek's list price and Command
# Code's V4.1 Flash and V4 Flash are exactly double at peak, which runs
# 01:00-04:00 and 06:00-10:00 UTC, Monday through Friday.
- insert:
    - id: cost-meter
      name: dsh-ui-cost-meter
      config:
        symbol: '$'
